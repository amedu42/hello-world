<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16324f" />
    <title>Proj4D</title>
    <meta name="description" content="Construction project progress, daily site reports, attendance and materials registers." />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Proj4D" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <style>
      /* Animated launch screen for the installed app (hidden in normal browser tabs). It picks up from the
         phone's own launch screen (the icon on navy) and fades into the app once it has loaded. */
      #splash { display: none; }
      .standalone body { background: #16324f; }
      .standalone #splash { display: flex; position: fixed; inset: 0; z-index: 9999; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(520px 380px at 50% 38%, #224b74 0, #16324f 70%); color: #fff; font: 600 15px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; transition: opacity .45s ease, transform .45s ease; }
      #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #splash .tile { width: 112px; height: 112px; animation: sp-pop .9s cubic-bezier(.2, .9, .3, 1.25) both; filter: drop-shadow(0 18px 30px rgba(5, 14, 26, .55)); }
      #splash .ground { stroke-dasharray: 18; stroke-dashoffset: 18; animation: sp-draw .55s .55s ease-out forwards; }
      #splash .house { stroke-dasharray: 44; stroke-dashoffset: 44; animation: sp-draw .95s .95s ease-in-out forwards; }
      #splash .glow { opacity: 0; animation: sp-glow 1.8s 1.9s ease-in-out infinite; }
      #splash .word { font-size: 30px; font-weight: 800; letter-spacing: -.01em; animation: sp-rise .7s 1.45s ease-out both; }
      #splash .tag { margin-top: -14px; color: #b8c7da; font-size: 14px; font-weight: 500; animation: sp-rise .7s 1.65s ease-out both; }
      #splash .load { width: 120px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .14); overflow: hidden; animation: sp-rise .5s 1.85s ease-out both; }
      #splash .load i { display: block; width: 40%; height: 100%; border-radius: 3px; background: #f2a900; animation: sp-load 1.1s 1.95s ease-in-out infinite; transform: translateX(-100%); }
      @keyframes sp-pop { from { transform: scale(.72); opacity: .0; } to { transform: scale(1); opacity: 1; } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-glow { 0%, 100% { opacity: 0; } 50% { opacity: .55; } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes sp-load { to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; transform: none !important; }
        #splash .glow { opacity: 0 !important; }
      }
    </style>
    <script>
      // Installed app (Android/desktop "standalone", or an iPhone home-screen app)?
      (function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (standalone) document.documentElement.classList.add('standalone');
      })();
    </script>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="tile" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#16324f" />
        <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.12)" stroke-width=".6" />
        <path class="glow" d="M7 23h18M10 23V13l6-4 6 4v10" stroke="#ffd36a" stroke-width="4.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        <path class="ground" d="M7 23h18" stroke="#f2a900" stroke-width="2.6" fill="none" stroke-linecap="round" />
        <path class="house" d="M10 23V13l6-4 6 4v10" stroke="#f2a900" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <div class="word">Proj4D</div>
      <div class="tag">Plan · Track · Report</div>
      <div class="load"><i></i></div>
    </div>
    <script>
      // Fade the launch screen out once the app is ready (and the animation has played), or after 6 s at most.
      (function () {
        var el = document.getElementById('splash');
        if (!document.documentElement.classList.contains('standalone')) { el.remove(); return; }
        var start = Date.now(), done = false;
        var minMs = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 2500; // full animation: 2.5 s
        function hide() {
          if (done) return;
          done = true;
          setTimeout(function () {
            el.classList.add('out');
            setTimeout(function () { el.remove(); }, 500);
          }, Math.max(0, minMs - (Date.now() - start)));
        }
        window.addEventListener('p4d:ready', hide);
        setTimeout(hide, 6000);
      })();
    </script>
    <div id="root"></div>
    <script>
      // Safety net: if the app's stylesheet didn't load (e.g. a bad copy in the offline cache), clear the
      // cache and service worker and reload once.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var styled = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim();
          if (styled) return;
          try { if (sessionStorage.getItem('p4d_css_repair')) return; sessionStorage.setItem('p4d_css_repair', '1'); } catch (e) { return; }
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
