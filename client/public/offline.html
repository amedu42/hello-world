<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#16324f" />
<title>SitePulse – offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16324f; color: #fff; font: 16px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; border-radius: 16px; }
  h1 { font-size: 22px; margin: 16px 0 6px; }
  p { color: #c9d4e2; max-width: 320px; margin: 0 auto 20px; }
  button { background: #f2a900; color: #1c1600; border: 0; border-radius: 8px; padding: 12px 22px; font: inherit; font-weight: 700; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>SitePulse needs an internet connection to load your projects. Check your signal or Wi-Fi and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
